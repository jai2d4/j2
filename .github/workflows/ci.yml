name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tru_admin
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tru_scouting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Load schema
        env:
          PGPASSWORD: test
        run: psql -h localhost -U tru_admin -d tru_scouting_test -f db/init_schema.sql

      - name: Run tests
        env:
          GEMINI_API_KEY: test-key-not-real
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: tru_scouting_test
          POSTGRES_USER: tru_admin
          POSTGRES_PASSWORD: test
        run: pytest -v
