name: Livephoria

# Scoped to the subtree: TruGrade's own CI is untouched by this.
on:
  push:
    branches: ["**"]
    paths: ["livephoria/**", ".github/workflows/livephoria.yml"]
  pull_request:
    paths: ["livephoria/**", ".github/workflows/livephoria.yml"]

jobs:
  platform:
    name: platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livephoria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: livephoria/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  control-plane:
    name: axiome
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livephoria/axiome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: livephoria/axiome/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
