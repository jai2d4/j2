<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRU Scouting Engine — Truth Report Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#0F1519; --panel:#18212A; --panel2:#131B22; --line:#26323D;
    --chalk:#E9EEF2; --dim:#8FA1AE; --laser:#FF4438; --pass:#43D17C; --amber:#E8B23A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--slate);color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
  .top{display:flex;justify-content:space-between;align-items:baseline;padding:18px 26px;border-bottom:1px solid var(--line)}
  .brand{font-family:'Barlow Condensed';font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
  .brand span{color:var(--laser)}
  .top .env{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim)}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:22px;padding:22px 26px;max-width:1180px;margin:0 auto}
  @media(max-width:840px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
  h2{font-family:'Barlow Condensed';font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
  label{display:block;font-size:11px;color:var(--dim);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;color:var(--chalk);
    font-family:'IBM Plex Mono';font-size:14px;padding:8px 10px}
  input:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:100px;
    padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Inter'}
  .chip:hover{color:var(--chalk);border-color:var(--dim)}
  .run{width:100%;margin-top:18px;background:var(--laser);border:none;border-radius:6px;color:#fff;
    font-family:'Barlow Condensed';font-weight:700;font-size:18px;letter-spacing:.16em;text-transform:uppercase;
    padding:12px;cursor:pointer}
  .run:hover{filter:brightness(1.1)}
  /* report */
  .banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:18px;position:relative;overflow:hidden}
  .tier-big{font-family:'Barlow Condensed';font-weight:700;font-size:44px;letter-spacing:.06em;line-height:1}
  .tier-sub{font-size:12px;color:var(--dim);margin-top:4px}
  .stamp{position:absolute;right:18px;top:50%;transform:translateY(-50%) rotate(-8deg);
    border:3px solid var(--amber);color:var(--amber);font-family:'Barlow Condensed';font-weight:700;
    font-size:22px;letter-spacing:.18em;padding:4px 14px;border-radius:4px;text-transform:uppercase;opacity:.95}
  .ladder{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .rung{font-family:'IBM Plex Mono';font-size:12px;padding:6px 12px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
  .rung.lit{background:rgba(67,209,124,.12);border-color:var(--pass);color:var(--pass)}
  .rung.failed{background:rgba(255,68,56,.08);border-color:rgba(255,68,56,.5);color:var(--laser);text-decoration:line-through}
  table{width:100%;border-collapse:collapse}
  th{font-family:'Barlow Condensed';font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
  td.val{font-family:'IBM Plex Mono';font-weight:600;font-size:15px}
  td.val.laser{color:var(--laser)}
  .pill{font-family:'IBM Plex Mono';font-size:11px;padding:3px 9px;border-radius:100px}
  .pill.pass{background:rgba(67,209,124,.14);color:var(--pass)}
  .pill.fail{background:rgba(255,68,56,.14);color:var(--laser)}
  .pill.na{background:rgba(232,178,58,.12);color:var(--amber)}
  .gc{margin-top:16px;border:1px solid var(--amber);border-left:5px solid var(--amber);border-radius:6px;
    background:rgba(232,178,58,.07);padding:14px 16px}
  .gc b{font-family:'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--amber)}
  .gc p{color:var(--chalk);margin-top:6px;font-size:13px;line-height:1.5}
  .film{margin-top:18px}
  .film pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:14px;
    font-family:'IBM Plex Mono';font-size:12px;color:#B8C7D2;overflow-x:auto;line-height:1.55}
  .film .tag{font-family:'IBM Plex Mono';font-size:10px;color:var(--amber);letter-spacing:.1em;margin-left:8px}
  .empty{color:var(--dim);padding:30px;text-align:center;font-size:13px}
  .drop{border:2px dashed var(--line);border-radius:8px;padding:22px 14px;text-align:center;color:var(--dim);
    cursor:pointer;font-size:13px;transition:border-color .15s}
  .drop:hover,.drop.over,.drop:focus{border-color:var(--amber);color:var(--chalk);outline:none}
  .drop-icon{font-size:20px;color:var(--laser);margin-bottom:6px}
  .drop-sub{font-family:'IBM Plex Mono';font-size:11px;margin-top:4px;color:var(--dim)}
  .pipeline{margin-top:12px;font-family:'IBM Plex Mono';font-size:12px}
  .pipeline .step{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--dim)}
  .pipeline .step.done{color:var(--pass)}
  .pipeline .step.active{color:var(--amber)}
  .pipeline .step.err{color:var(--laser)}
  .filmname{margin-top:12px;font-family:'IBM Plex Mono';font-size:12px;color:var(--chalk);word-break:break-all}
  @media (prefers-reduced-motion:no-preference){
    .report-in{animation:fade .25s ease}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="top">
  <div class="brand">TRU<span>·</span>SCOUTING ENGINE <span style="color:var(--dim);font-size:16px">/ TRUTH REPORT PANEL</span></div>
  <div class="env">gemini-3.5-flash · metric sieve v1.0</div>
</div>

<div class="wrap">
  <div class="card">
    <h2>Athlete Intake</h2>
    <div class="presets">
      <button class="chip" onclick="loadPreset('fbs')">FBS-ready DB</button>
      <button class="chip" onclick="loadPreset('burner')">Undersized burner</button>
      <button class="chip" onclick="loadPreset('rb')">Bubble RB</button>
    </div>
    <label>Position</label>
    <select id="position">
      <option>QB</option><option>RB</option><option>WR</option><option selected>DB</option>
      <option>LB</option><option>DE</option><option>DL</option><option>OL</option><option>TE</option>
    </select>
    <div class="row2">
      <div><label>Height (in)</label><input id="height" type="number" step="0.5" placeholder="72"></div>
      <div><label>Weight (lbs)</label><input id="weight" type="number" placeholder="190"></div>
    </div>
    <div class="row2">
      <div><label>40-yd (laser)</label><input id="forty" type="number" step="0.01" placeholder="4.45"></div>
      <div><label>Pro-agility (laser)</label><input id="shuttle" type="number" step="0.01" placeholder="4.15"></div>
    </div>
    <div class="row2">
      <div><label>Bench (lbs)</label><input id="bench" type="number" placeholder="—"></div>
      <div><label>Squat (lbs)</label><input id="squat" type="number" placeholder="—"></div>
    </div>
    <div class="row2">
      <div><label>GPA</label><input id="gpa" type="number" step="0.01" placeholder="3.2"></div>
      <div><label>SAT</label><input id="sat" type="number" placeholder="1050"></div>
    </div>
    <div class="row2">
      <div><label>ACT</label><input id="act" type="number" placeholder="18"></div>
      <div></div>
    </div>
    <button class="run" onclick="run()">Run Metric Sieve</button>

    <h2 style="margin-top:24px">Film Upload — Module 1</h2>
    <div class="drop" id="drop" tabindex="0"
         ondragover="event.preventDefault();this.classList.add('over')"
         ondragleave="this.classList.remove('over')"
         ondrop="event.preventDefault();this.classList.remove('over');handleFile(event.dataTransfer.files[0])"
         onclick="document.getElementById('filepick').click()"
         onkeydown="if(event.key==='Enter')document.getElementById('filepick').click()">
      <div class="drop-icon">▲</div>
      <div>Drop game film here or click to browse</div>
      <div class="drop-sub">.mp4 · .mov · .avi</div>
    </div>
    <input id="filepick" type="file" accept=".mp4,.mov,.avi,video/*" style="display:none"
           onchange="handleFile(this.files[0])">
    <div id="filmstatus"></div>
  </div>

  <div class="card" id="report">
    <h2>Truth Report</h2>
    <div class="empty">Load a preset or enter combine numbers, then run the sieve.</div>
  </div>
</div>

<script>
// ===== 1:1 port of app/services/metric_sieve.py =====
const MATRIX = {
  "QB|D1_FBS":{height:[74,78],weight:[200,240],forty:[4.60,4.90],gpa_min:3.0,sat_min:1000,act_min:18},
  "QB|D2_D3_NAIA_JUCO":{height:[72,77],weight:[180,225],forty:[4.70,5.00]},
  "RB|D1_FBS":{height:[69,73],weight:[190,230],forty:[4.40,4.60],bench_min:300,squat_min:450,gpa_min:3.0,sat_min:1000,act_min:18},
  "RB|D1_FCS_D2":{height:[68,72],weight:[180,220],forty:[4.50,4.70]},
  "WR|D1_FBS":{height:[72,76],weight:[180,220],forty:[4.30,4.60],gpa_min:3.0,sat_min:1000,act_min:18},
  "WR|D1_FCS_D2":{height:[70,75],weight:[170,210],forty:[4.40,4.70]},
  "DB|D1_FBS":{height:[70,74],weight:[175,210],forty:[4.40,4.60],shuttle_max:4.20},
  "DB|D1_FCS":{height:[69,73],weight:[170,200],forty:[4.50,4.70]},
  "LB|D1_FBS":{height:[73,76],weight:[220,250],forty:[4.50,4.70]},
  "DE|D1_FBS":{height:[75,78],weight:[240,280],forty:[4.60,4.80]},
  "DL|D1_FBS":{height:[75,78],weight:[250,320],forty:[4.80,5.10]},
  "OL|D1_FBS":{height:[76,80],weight:[280,330],forty:[5.00,5.30]},
  "TE|D1_FBS":{height:[76,79],weight:[230,270],forty:[4.60,4.80]},
};
const LADDER = {QB:["D1_FBS","D2_D3_NAIA_JUCO"],RB:["D1_FBS","D1_FCS_D2"],WR:["D1_FBS","D1_FCS_D2"],
  DB:["D1_FBS","D1_FCS"],LB:["D1_FBS"],DE:["D1_FBS"],DL:["D1_FBS"],OL:["D1_FBS"],TE:["D1_FBS"]};

const inRange=(v,lo,hi)=>v==null?null:(lo!=null&&v<lo)?false:(hi!=null&&v>hi)?false:true;

const escapeHtml=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function runSieve(pos,a){
  let best=null, walked=[];
  for(const tier of LADDER[pos]){
    const m=MATRIX[pos+"|"+tier], checks=[];
    if(m.forty) checks.push({metric:"forty_yard_dash",label:"40-yd dash",laser:true,value:a.forty,threshold:m.forty[0]+"–"+m.forty[1]+"s",passed:inRange(a.forty,null,m.forty[1])});
    if(m.shuttle_max) checks.push({metric:"pro_agility_shuttle",label:"Pro-agility",laser:true,value:a.shuttle,threshold:"≤ "+m.shuttle_max+"s",passed:inRange(a.shuttle,null,m.shuttle_max)});
    if(m.height) checks.push({metric:"height_in",label:"Height",value:a.height,threshold:m.height[0]+"–"+m.height[1]+" in",passed:inRange(a.height,m.height[0],m.height[1])});
    if(m.weight) checks.push({metric:"weight_lbs",label:"Weight",value:a.weight,threshold:m.weight[0]+"–"+m.weight[1]+" lbs",passed:inRange(a.weight,m.weight[0],m.weight[1])});
    if(m.bench_min) checks.push({metric:"bench_lbs",label:"Bench",value:a.bench,threshold:"≥ "+m.bench_min+" lbs",passed:inRange(a.bench,m.bench_min,null)});
    if(m.squat_min) checks.push({metric:"squat_lbs",label:"Squat",value:a.squat,threshold:"≥ "+m.squat_min+" lbs",passed:inRange(a.squat,m.squat_min,null)});
    if(m.gpa_min) checks.push({metric:"gpa",label:"GPA",value:a.gpa,threshold:"≥ "+m.gpa_min,passed:inRange(a.gpa,m.gpa_min,null)});
    if(m.sat_min&&a.sat!=null) checks.push({metric:"sat",label:"SAT",value:a.sat,threshold:"≥ "+m.sat_min,passed:inRange(a.sat,m.sat_min,null)});
    if(m.act_min&&a.act!=null) checks.push({metric:"act",label:"ACT",value:a.act,threshold:"≥ "+m.act_min,passed:inRange(a.act,m.act_min,null)});
    let hardFail=checks.some(c=>c.passed===false&&!["sat","act"].includes(c.metric));
    const acad=checks.filter(c=>["sat","act"].includes(c.metric));
    if(acad.length&&!acad.some(c=>c.passed)) hardFail=true;
    const res={position:pos,tier,checks,hard_metrics_passed:!hardFail,is_game_changer:false,game_changer_reason:null};
    if(checks.every(c=>c.passed==null)){ // no data provided → cannot project
      res.hard_metrics_passed=false; res.tier="UNRANKED"; res.walked=walked; return res;
    }
    walked.push({tier,passed:!hardFail});
    if(!hardFail){res.walked=walked;return res;}
    if(!best) best=res;
  }
  const laser=best.checks.filter(c=>c.laser), frame=best.checks.filter(c=>["height_in","weight_lbs"].includes(c.metric));
  if(laser.length&&laser.every(c=>c.passed!==false)&&laser.some(c=>c.passed)&&frame.some(c=>c.passed===false)){
    best.is_game_changer=true;
    best.game_changer_reason="Laser metrics meet or beat D1 FBS thresholds despite out-of-bracket frame. Flag for Truth Report Panel manual review.";
  } else { best.tier="UNRANKED"; }
  best.walked=walked; return best;
}

// ===== Simulated Gemini film block (live build calls gemini-3.5-flash) =====
const FILM = {
  physical_projection:{frame:"compact, low center of gravity",length:"average wingspan",operational_weight:"plays above listed weight"},
  explosive_traits:{hip_fluidity:"loose, snaps transitions",vertical_break_on_ball:"elite trigger",acceleration_windows:"0–10 yd burst is best trait"},
  mechanics_grade:8.5,
  situational_attributes:{spatial_awareness:"anticipates route stems",contact_balance:"finishes through contact"}
};

// ===== Film upload pipeline (Module 1) =====
// Tries the real backend at localhost:8000 first; falls back to simulated
// output so the demo works standalone.
let filmState = {name:null, mode:null, analysis:null};
const API = "http://localhost:8000/api/v1/scout/analyze-film";

function pipelineHTML(steps){
  return '<div class="pipeline">'+steps.map(s=>
    `<div class="step ${s.state}">${s.state==="done"?"●":s.state==="active"?"◐":s.state==="err"?"✕":"○"} ${s.label}</div>`
  ).join("")+"</div>";
}

async function handleFile(file){
  if(!file) return;
  const ok=/\.(mp4|mov|avi)$/i.test(file.name);
  const box=document.getElementById("filmstatus");
  if(!ok){box.innerHTML='<div class="pipeline"><div class="step err">✕ Invalid video format (.mp4 / .mov / .avi)</div></div>';return;}
  filmState={name:file.name, mode:null, analysis:null};
  const safeName=escapeHtml(file.name);
  box.innerHTML=`<div class="filmname">${safeName} · ${(file.size/1048576).toFixed(1)} MB</div>`+
    pipelineHTML([{label:"upload received",state:"done"},{label:"sending to gemini-3.5-flash…",state:"active"},{label:"awaiting analysis",state:""}]);

  // Attempt live backend
  try{
    const fd=new FormData(); fd.append("file",file); fd.append("position",document.getElementById("position").value);
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),90000);
    const res=await fetch(API,{method:"POST",body:fd,signal:ctl.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    filmState.mode="live"; filmState.analysis=data.analysis;
    box.innerHTML=`<div class="filmname">${safeName}</div>`+
      pipelineHTML([{label:"upload received",state:"done"},{label:"gemini-3.5-flash ingestion",state:"done"},{label:"analysis complete — LIVE API",state:"done"}]);
  }catch(e){
    // Backend not running → simulate the pipeline so the UX is still visible
    await new Promise(r=>setTimeout(r,900));
    box.innerHTML=`<div class="filmname">${safeName}</div>`+
      pipelineHTML([{label:"upload received",state:"done"},{label:"backend offline — simulated analysis",state:"done"},{label:"start uvicorn on :8000 for live Gemini calls",state:"active"}]);
    filmState.mode="simulated"; filmState.analysis=FILM;
  }
  run();
}

const PRESETS = {
  fbs:{position:"DB",height:72,weight:190,forty:4.45,shuttle:4.15},
  burner:{position:"DB",height:68,weight:165,forty:4.38,shuttle:4.10},
  rb:{position:"RB",height:70,weight:200,forty:4.62,bench:250,squat:400},
};
function loadPreset(k){
  const p=PRESETS[k];
  for(const id of["height","weight","forty","shuttle","bench","squat","gpa","sat","act"]) document.getElementById(id).value=p[id]??"";
  document.getElementById("position").value=p.position;
  run();
}
const num=id=>{const v=document.getElementById(id).value;return v===""?null:parseFloat(v);};

function run(){
  const pos=document.getElementById("position").value;
  const a={height:num("height"),weight:num("weight"),forty:num("forty"),shuttle:num("shuttle"),
           bench:num("bench"),squat:num("squat"),gpa:num("gpa"),sat:num("sat"),act:num("act")};
  const r=runSieve(pos,a);
  const tierLabel=r.tier.replaceAll("_"," ");
  const ladder=r.walked.map(w=>`<span class="rung ${w.passed?"lit":"failed"}">${w.tier.replaceAll("_"," ")}</span>`).join("");
  const rows=r.checks.map(c=>{
    const pill=c.passed===true?'<span class="pill pass">PASS</span>':c.passed===false?'<span class="pill fail">FAIL</span>':'<span class="pill na">NO DATA</span>';
    return `<tr><td>${c.label}${c.laser?' <span style="color:var(--laser);font-size:10px;font-family:IBM Plex Mono">LASER</span>':''}</td>
      <td class="val ${c.laser?"laser":""}">${c.value??"—"}</td><td style="color:var(--dim);font-family:IBM Plex Mono;font-size:12px">${c.threshold}</td><td>${pill}</td></tr>`;
  }).join("");
  document.getElementById("report").innerHTML=`
    <h2>Truth Report</h2>
    <div class="report-in">
    <div class="banner">
      <div>
        <div class="tier-big" style="color:${r.hard_metrics_passed?"var(--pass)":r.is_game_changer?"var(--amber)":"var(--laser)"}">${tierLabel}</div>
        <div class="tier-sub">${pos} · projected bracket · hard metrics ${r.hard_metrics_passed?"cleared":"not cleared"}</div>
      </div>
      ${r.is_game_changer?'<div class="stamp">Game Changer</div>':""}
    </div>
    <div class="ladder">${ladder}</div>
    <table>
      <tr><th>Metric</th><th>Athlete</th><th>Threshold</th><th>Sieve</th></tr>
      ${rows}
    </table>
    ${r.is_game_changer?`<div class="gc"><b>⚑ Out-of-bracket flag</b><p>${r.game_changer_reason}</p></div>`:""}
    <div class="film">
      <h2 style="margin-bottom:8px">Film Analysis — gemini-3.5-flash
        <span class="tag">${filmState.mode==="live"?"LIVE API RESULT":filmState.mode==="simulated"?"SIMULATED — BACKEND OFFLINE":"AWAITING FILM UPLOAD"}</span></h2>
      ${filmState.analysis
        ?`<div class="filmname" style="margin:0 0 8px">${escapeHtml(filmState.name)}</div><pre>${escapeHtml(JSON.stringify(filmState.analysis,null,2))}</pre>`
        :'<div class="empty" style="padding:18px">No film uploaded yet — drop a clip in the Film Upload panel to populate this section.</div>'}
    </div>
    </div>`;
}
</script>
</body>
</html>
